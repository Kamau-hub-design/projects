services:
  smartlight:
    build:
      context: .
    container_name: smartlight
    ports:
      - "5000:5000"
    environment:
      SMARTLIGHT_HOST: 0.0.0.0
      SMARTLIGHT_PORT: 5000
      SMARTLIGHT_DEBUG: "false"
      SMARTLIGHT_SECRET_KEY: change-me-in-production
    restart: unless-stopped
